[mypy]
# Путь к Python-коду, который анализируем
files = src, test
# Пропускаем импорты без стабов
ignore_missing_imports = True
# Не позволять «неявный Optional» (None там, где ждут не-None)
no_implicit_optional = True
# Запрет на функции без аннотаций
disallow_untyped_defs = True
# Запрет на «неполные» функции (например, только часть аргументов)
disallow_incomplete_defs = True
# Запрет на переменные без указания типа там, где это важно
check_untyped_defs = True
# Предупреждения об использовании Any
warn_return_any = True
warn_unused_ignores = True
# Строгая проверка Optional
strict_optional = True
# Показывать коды ошибок
show_error_codes = True
# Цветной вывод
color_output = True

# Игнорируем сторонние библиотеки без стабов
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

# В тестах разрешаем свободные аннотации
[mypy-test.*]
disallow_untyped_defs = False